<!DOCTYPE html>

<head>

  <meta name="color-scheme" content="light dark" />

  <style>
    /* Critical styles to prevent flash */
    :root {
      --bg-color: #FDFCF9;
      --text-color: #262626;
      --code-bg: #F5F4ED;
      --diagram-bg: #F5F4ED;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1E1D1B;
        --text-color: #D6D1C6;
        --code-bg: #282724;
        --diagram-bg: #282724;
      }
    }

    .darkmode {
      --bg-color: #1E1D1B;
      --text-color: #D6D1C6;
      --code-bg: #282724;
      --diagram-bg: #282724;
    }

    html,
    body {
      background: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    img {
      image-rendering: auto;
      color-scheme: only light;
      image-orientation: from-image;
      max-width: 100%;
      height: auto;
    }
  </style>

  <base href="file:///Users/ricolee/Desktop/rico/TextOne/public/preview//">

  <!-- DiagramHandler draws every map itself. Left automatic, the loader
       redraws any .markmap element when a page loads, and the PDF export
       loads the preview's HTML, where drawn maps carry that class: it drew
       each one again from its SVG's text and the PDF showed a blank box. -->
  <script>window.markmap = { autoLoader: { manual: true } };</script>

  <script>
    // Deferred scripts (common.js, theme-config.js) execute before DOMContentLoaded,
    // so wrapping here ensures MiaoYanCommon and ThemeConfig are defined before use.
    document.addEventListener('DOMContentLoaded', function () {
