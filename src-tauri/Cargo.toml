[package]
name = "textone"
version = "0.1.0"
description = "A quiet Markdown editor"
authors = ["TextOne"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The desktop shell and any future test harness both build against this.
name = "textone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = { version = "0.49.0", default-features = false }
tauri-plugin-dialog = "2.7.3"
base64 = "0.23.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
